[project]
name = "app-env-installer"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "click",
    "distro",
    "prettytable",
    "pyyaml",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
