[project]
name = "app-env-installer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "click",
    "prettytable",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
