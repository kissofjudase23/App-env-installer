[project]
name = "app-env-installer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "click",
    "prettytable",
    "pyyaml",
]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The shell and pwsh smoke tests each spawn a process; pytest-xdist runs them side by side,
# except the pwsh ones, which test_powershell.py pins to one worker (xdist_group)
addopts = "-n auto --dist loadgroup"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
