"$schema" = 'https://starship.rs/config-schema.json'

# Based on `starship preset tokyo-night` (https://starship.rs/presets/#tokyo-night).
# Changed: rounded start cap instead of the ░▒▓ fade.
# Added: python (venv only), cmd_duration, jobs, username/hostname (root/SSH only).

format = """
[](#a3aed2)\
$os\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$bun\
$rust\
$golang\
$php\
$python\
$cmd_duration\
$jobs\
$username\
$hostname\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[jj_bookmark]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:#769ff0 bg:#394260)]($style)'

[jj_status]
style = "bg:#394260"
format = '[[($all )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[bun]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'

[os]
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

# Only an active virtualenv
[python]
detect_extensions = []
detect_files = []
symbol = ""
style = "bg:#212736"
format = '[[ $symbol $virtualenv ](fg:#769ff0 bg:#212736)]($style)'

[cmd_duration]
min_time = 3_000
style = "bg:#212736"
format = '[[ 󱦟 $duration ](fg:#e0af68 bg:#212736)]($style)'

[jobs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol $number ](fg:#769ff0 bg:#212736)]($style)'

# Shown for root or over SSH only (starship defaults)
[username]
style_user = "fg:#769ff0 bg:#212736"
style_root = "fg:#f7768e bg:#212736"
format = '[ $user]($style)'

[hostname]
style = "fg:#769ff0 bg:#212736"
format = '[@$hostname ]($style)'
