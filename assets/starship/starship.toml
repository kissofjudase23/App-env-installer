"$schema" = 'https://starship.rs/config-schema.json'

# Mirrors the former Powerlevel10k "rainbow" setup: two lines, powerline segments,
# left = os/dir/git, right (via $fill) = duration/jobs/venv/go/user@host, then a ❯ prompt char.
# Colors are terminal palette indexes so they follow the terminal theme, like p10k did.
add_newline = false

format = """
$os\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$jobs\
$python\
$golang\
$username\
$hostname\
$line_break\
$character"""

[fill]
symbol = ' '

[os]
disabled = false
style = 'fg:232 bg:7'
format = '[ $symbol ]($style)'

[os.symbols]
Macos = ''
Ubuntu = ''
Linux = ''

# The tail arrow is drawn here outside git repos, and by git_status inside them
[directory]
style = 'fg:0 bg:4'
read_only = ' '
read_only_style = 'fg:0 bg:4'
truncation_length = 4
truncation_symbol = '…/'
fish_style_pwd_dir_length = 1
format = '[](fg:7 bg:4)[ $path ]($style)[$read_only]($read_only_style)[](fg:4)'
repo_root_style = 'bold fg:0 bg:4'
repo_root_format = '[](fg:7 bg:4)[ $before_root_path]($style)[$repo_root]($repo_root_style)[$path ]($style)[$read_only]($read_only_style)'

[git_branch]
symbol = ' '
style = 'fg:0 bg:2'
format = '[](fg:4 bg:2)[ $symbol$branch(:$remote_branch) ]($style)'

[git_status]
style = 'fg:0 bg:2'
format = '[($all_status$ahead_behind )]($style)[](fg:2)'

[cmd_duration]
min_time = 3_000
style = 'fg:0 bg:3'
format = '[](fg:3)[ $duration  ]($style)'

[jobs]
symbol = ''
number_threshold = 1_000
style = 'fg:6 bg:0'
format = '[](fg:0)[ $symbol ]($style)'

# Only an active virtualenv, like p10k's virtualenv segment
[python]
detect_extensions = []
detect_files = []
symbol = ' '
style = 'fg:0 bg:4'
format = '[](fg:4)[ $symbol$virtualenv ]($style)'

[golang]
symbol = ' '
style = 'fg:255 bg:2'
format = '[](fg:2)[ $symbol$version ]($style)'

# Shown for root or over SSH only (starship defaults), like p10k's context segment
[username]
style_user = 'fg:3 bg:0'
style_root = 'fg:1 bg:0'
format = '[](fg:0)[ $user]($style)'

[hostname]
style = 'fg:3 bg:0'
format = '[@$hostname ]($style)'

[character]
success_symbol = '[❯](bold fg:76)'
error_symbol = '[❯](bold fg:196)'
vimcmd_symbol = '[❮](bold fg:76)'
