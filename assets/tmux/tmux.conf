### rebind hotkey

# session management
# create new: tmux new -s ${session_name}
# detach (inside the session): prefix + d
# leave: C + d or exit

# windows management
# create a new window: prefix + c
# switch to next window: prefix + n
# switch to prev window: prefix + p
# switch to nth window: prefix + ${window_number}

# prefix setting (screen-like)
# Set Control + a as prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# reload config without killing server
bind R source-file ~/.tmux.conf \; display-message "Config reloaded..."

# "|" splits the current window vertically, and "-" splits it horizontally;
# new panes and windows start in the current pane's directory
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r Left  resize-pane -L 4
bind -r Down  resize-pane -D 4
bind -r Up    resize-pane -U 4
bind -r Right resize-pane -R 4

# Copy mode (prefix + [) with vi keys: v selects, y copies
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

### other optimization

# set the shell you like (zsh, "which zsh" to find the path)
set -g default-command $SHELL
set -g default-shell $SHELL

# display things in 256 colors
# macOS system ncurses may lack tmux-256color
if-shell 'infocmp tmux-256color > /dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
set -as terminal-features ",*:RGB"

# mouse is great!
set-option -g mouse on

# history size
set -g history-limit 10000

# fix delay
set -g escape-time 0

# pass focus changes to vim/nvim (autoread, FocusGained)
set -g focus-events on

# 0 is too far
set -g base-index 1
setw -g pane-base-index 1

# stop auto renaming
setw -g automatic-rename off
set-option -g allow-rename off

# renumber windows sequentially after closing
set -g renumber-windows on

# window notifications; display activity on other window
setw -g monitor-activity on
set -g visual-activity on
