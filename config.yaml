

git_repos:
  - {name: "oh-my-zsh",
     src: "https://github.com/ohmyzsh/ohmyzsh.git",
     dst:  ".oh-my-zsh"}

dotfiles:
  - {name: "vimrc",
     src: "assets/editor/vimrc.vim",
     dst: ".vimrc"}

  # nvim and vim use the same config
  - {name: "nvim_init",
     src: "assets/editor/vimrc.vim",
     dst: ".config/nvim/init.vim"}

  # bash login shells (macOS terminals, ssh)
  - {name: "bash_profile",
     src: "assets/shell/bash_profile.sh",
     dst: ".bash_profile"}

  # bash
  - {name: "bashrc",
     src: "assets/shell/bashrc.sh",
     dst: ".bashrc"}

  # zsh
  - {name: "zshrc",
     src: "assets/shell/zshrc.zsh",
     dst: ".zshrc"}

  - {name: "starship",
     src: "assets/starship/starship.toml",
     dst: ".config/starship.toml"}

  - {name: "gitconfig",
     src: "assets/git/gitconfig",
     dst: ".gitconfig"}

  - {name: "tmux",
     src: "assets/tmux/tmux.conf",
     dst: ".tmux.conf"}

  - {name: "tigrc",
     src: "assets/tig/tigrc",
     dst: ".tigrc"}

  - {name: "screenrc",
     src: "assets/screen/screenrc",
     dst: ".screenrc"}

  - {name: "assets",
     src: "assets",
     dst: ".assets"}

# Nerd Fonts release archives (<name>.tar.xz) installed on Linux; macOS uses Brewfile casks
nerd_fonts:
  - "Meslo"
  - "Mononoki"

# Installed with `go install`; the active toolchain follows GOTOOLCHAIN (default: auto)
go_tools:
  - "golang.org/x/tools/gopls@latest"
  - "golang.org/x/tools/cmd/goimports@latest"
  - "github.com/go-delve/delve/cmd/dlv@latest"
