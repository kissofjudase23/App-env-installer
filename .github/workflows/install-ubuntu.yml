name: Install (Ubuntu)

# Runs the real install.sh in fresh containers; ci.yml only covers install.py and linting.
on:
  # Weekly: catches upstream drift (renamed release assets, apt/gh repo changes) with no commit here
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [master]
    paths: &paths
      - install.sh
      - install.py
      - packages/apt-packages.txt
      - packages/apt-cloud-packages.txt
      - config.yaml
      - Makefile
      - .python-version
      - pyproject.toml
      - uv.lock
      - assets/shell/**
      - .github/workflows/install-ubuntu.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs; a push to master must not cancel the weekly run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
        # arm64 exercises the aarch64 release assets and the shellcheck-py sdist build
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: ubuntu:${{ matrix.ubuntu }}
    timeout-minutes: 30
    env:
      # Container jobs default HOME to /github/home, which root does not own
      HOME: /root
      # Lifts the GitHub API rate limit shared by all runners
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      # sudo resets DEBIAN_FRONTEND, so make debconf noninteractive system-wide
      - name: Install prerequisites
        run: |
          echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git sudo

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --cloud also covers the optional cloud CLIs; the default path is a subset of it
      - name: Install
        run: bash install.sh --cloud

      - name: Re-run with --upgrade
        run: bash install.sh --upgrade --cloud

      - name: Verify
        run: |
          source install.sh
          [[ "$(getent passwd root | cut -d: -f7)" == "$(command -v zsh)" ]]
          zsh -i -c 'for tool in aws az bat curl delta dig eza fd fzf gcloud gh go nc nvim openssl starship terraform uv zoxide; do
            command -v "${tool}" > /dev/null || { echo "${tool} not on PATH" >&2; exit 1; }
          done'
          nvim_version="$(zsh -i -c 'nvim --version | head -n1')"
          version_at_least "${NVIM_MIN_VERSION}" "${nvim_version#NVIM v}"
          # common.sh must stay silent for scp / ssh host cmd
          [[ -z "$(bash -c 'source ~/.bash_profile' 2>&1)" ]]
          # Installers must not append to rc files (the uv installer edits ~/.profile by default)
          if grep -qsF '.local/bin/env' ~/.profile; then echo "${HOME}/.profile was modified" >&2; exit 1; fi
          # ~/.gitconfig links into the repo, so trust the root-run checkout from a separate file
          git config --file /tmp/safe.gitconfig safe.directory '*'
          GIT_CONFIG_GLOBAL=/tmp/safe.gitconfig git diff --exit-code
          # make comes from apt-packages.txt, shellcheck and shfmt from uv.lock; uv lives in ~/.local/bin
          PATH="${HOME}/.local/bin:${PATH}" make check
