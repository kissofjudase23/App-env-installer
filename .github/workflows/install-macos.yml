name: Install (macOS)

# Runs the real install.sh on a macOS runner; ci.yml only covers install.py and linting.
on:
  # Weekly: catches upstream drift (renamed formulae or casks, release changes) with no commit here
  schedule:
    - cron: "27 3 * * 1"
  push:
    branches: [master]
    paths: &paths
      - install.sh
      - install.py
      - packages/Brewfile
      - config.yaml
      - .python-version
      - pyproject.toml
      - uv.lock
      - assets/shell/**
      - .github/workflows/install-macos.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs; a push to master must not cancel the weekly run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Lifts the GitHub API rate limit shared by all runners
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        run: bash install.sh

      - name: Re-run with --upgrade
        run: bash install.sh --upgrade

      - name: Verify
        run: |
          source install.sh
          load_brew_env
          [[ "$(login_shell)" == "$(command -v zsh)" ]]
          zsh -i -c 'for tool in bat delta eza fd fzf gh go nvim starship uv zoxide; do
            command -v "${tool}" > /dev/null || { echo "${tool} not on PATH" >&2; exit 1; }
          done'
          # common.sh must stay silent for scp / ssh host cmd
          [[ -z "$(bash -c 'source ~/.bash_profile' 2>&1)" ]]
          # Installers must not append to the dotfiles, which are symlinks into this repo
          git diff --exit-code
