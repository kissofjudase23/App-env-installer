name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes no floating major tag; Dependabot bumps the pin
      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # zsh for tests/test_shell.py (macOS ships it)
      - name: Install shell tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt zsh

      # pwsh for tests/test_powershell.py ships on all runners
      - name: Test
        run: uv run pytest

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: make shellcheck

      - name: shfmt
        if: runner.os == 'Linux'
        run: make shfmt

      # make runs its recipes in pwsh on Windows; install.ps1 installs make on real machines
      - name: PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-PSResource PSScriptAnalyzer -TrustRepository -Quiet
          }
          choco install make -y --no-progress
          make pslint

      - name: Dry run
        run: uv run install.py -a -y --dry-run
