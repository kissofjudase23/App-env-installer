name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by commit; Dependabot bumps the SHA and the version comment
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # zsh for tests/test_shell.py (macOS ships it)
      - name: Install shell tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt zsh

      # pwsh for tests/test_powershell.py ships on all runners
      - name: Test
        run: uv run pytest

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: make shellcheck

      - name: shfmt
        if: runner.os == 'Linux'
        run: make shfmt

      - name: actionlint
        if: runner.os == 'Linux'
        run: make actionlint

      # Same command as `make pslint` (the Makefile's PSLINT); make itself is only installed on
      # real machines by install.ps1 and exercised by install-windows.yml
      - name: PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-PSResource PSScriptAnalyzer -TrustRepository -Quiet
          }
          $r = foreach ($f in 'install.ps1', 'assets/shell/profile.ps1') {
            Invoke-ScriptAnalyzer -Settings PSScriptAnalyzerSettings.psd1 -Path $f
          }
          $r
          exit [int][bool]$r

      - name: Dry run
        run: uv run install.py -a -y --dry-run
