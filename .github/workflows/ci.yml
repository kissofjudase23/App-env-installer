name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: make shellcheck

      - name: Dry run
        run: uv run install.py -a -y --dry-run
